# L'exterieur se parcourt comme l'interieur : en zones successives, pas en un
# seul bloc. Personne ne coche « exterieur » puis trie quinze objets ; on fait
# le tour de l'enveloppe, puis le jardin, puis la terrasse.

- key: facade_toiture
