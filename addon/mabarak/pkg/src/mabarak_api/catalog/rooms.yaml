# Pieces types proposees a la premiere etape du didacticiel.
#
# L'ordre est celui du parcours propose : on suit le trajet naturel d'un tour de
# maison (pieces de vie, puis annexes, puis exterieur), pour que l'utilisateur
# n'ait pas l'impression de sauter d'un bout a l'autre de chez lui.
#
# `location_type` est le slug d'un type de lieu pre-alimente de schema.sql.
# `items` ne liste que des cles definies dans items.yaml : un meme objet peut
# etre propose dans plusieurs pieces (un siphon, des volets), il n'est defini
# qu'une seule fois.

- key: cuisine
  label: Cuisine
  location_type: room
  items:
    - refrigerateur
    - lave_vaisselle
    - four
    - hotte
    - evier_siphon
    - volets
    - fenetres

- key: salle_de_bain
  label: Salle de bain
  location_type: room
  items:
