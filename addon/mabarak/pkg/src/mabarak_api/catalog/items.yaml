# Objets typiques proposes pendant le didacticiel de demarrage.
#
# REGLE D'EVOLUTION : `key` est un contrat. On n'en renomme jamais aucune ; on
# ajoute de nouvelles entrees, ou on marque `deprecated: true` pour retirer un
# objet des propositions sans casser ce qui le referencait.
#
# `category` est le slug d'une categorie pre-alimentee de schema.sql. Il est
# volontairement absent quand aucune categorie existante ne convient : mieux
# vaut une fiche sans categorie qu'une fiche rangee au mauvais endroit. Ces
# manques sont la matiere premiere de la reflexion sur la taxonomie.
#
# `anchor` (voir adr/0004) : 'from_due_date' pour tout ce qui est reglementaire
# ou contractuel et ne doit pas deriver si l'utilisateur s'y prend en retard ;
# 'from_completion' (defaut) pour l'entretien d'usage.

# --- Cuisine -----------------------------------------------------------------

- key: refrigerateur
  label: Réfrigérateur
  kind: equipment
  category: fridge
  maintenances:
    - key: refrigerateur_degivrage
      label: Dégivrer et nettoyer l'intérieur
      recurrence: { type: months, interval: 6 }
    - key: refrigerateur_grille
      label: Dépoussiérer la grille arrière
      description: Une grille encrassée fait surconsommer l'appareil.
      recurrence: { type: months, interval: 12 }

- key: lave_vaisselle
  label: Lave-vaisselle
  kind: equipment
  category: dishwasher
  maintenances:
    - key: lave_vaisselle_filtre
      label: Nettoyer le filtre
      recurrence: { type: months, interval: 1 }
    - key: lave_vaisselle_detartrage
      label: Détartrer
      recurrence: { type: months, interval: 6 }

- key: four
  label: Four
  kind: equipment
  category: oven
  maintenances:
    - key: four_nettoyage
      label: Nettoyer (pyrolyse ou dégraissage)
      recurrence: { type: months, interval: 3 }

- key: hotte
  label: Hotte aspirante
  kind: equipment
  category: extractor
  maintenances:
    - key: hotte_filtre_graisse
      label: Dégraisser le filtre métallique
      recurrence: { type: months, interval: 3 }
    - key: hotte_filtre_charbon
      label: Remplacer le filtre à charbon
      description: Uniquement sur une hotte à recyclage, sans évacuation extérieure.
      recurrence: { type: months, interval: 12 }

- key: evier_siphon
  label: Évier (siphon)
  kind: building_element
  # Aucune categorie du bati ne couvre la plomberie a ce jour.
  maintenances:
    - key: evier_siphon_nettoyage
      label: Démonter et nettoyer le siphon
      recurrence: { type: months, interval: 6 }

