---
# Configuration de l'add-on MaBarak.
# Reference : https://developers.home-assistant.io/docs/add-ons/configuration

name: MaBarak
version: "0.32.1"
slug: mabarak
description: >-
  Gestion et entretien de la maison : equipements, elements de construction,
  entretiens recurrents, historique, documents, garanties et couts. Local-first.
url: https://github.com/k69sknk/myhome

arch:
  - aarch64
  - amd64

# `init: false` est obligatoire : les images de base Home Assistant fournissent
# deja s6-overlay comme systeme d'init.
init: false
# `startup` (application) et `boot` (auto) sont les defauts HA : le linter
# refuse de les restater.

# --- Ingress ---------------------------------------------------------------
# L'interface est servie dans le panneau lateral de Home Assistant, qui gere
# l'authentification. Le port d'ingress par defaut est 8099.
ingress: true
panel_icon: mdi:home-heart
panel_title: MaBarak

# Le port direct reste FERME en production : l'interface passe par l'ingress.
# Le mettre a `8099` permet d'y acceder directement, mais court-circuite alors
# l'authentification Home Assistant. Reserve au developpement.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    Non requis. L'interface passe par l'ingress Home Assistant. N'ouvrir ce port
    qu'en developpement, il contourne l'authentification.

# --- Integration ------------------------------------------------------------
# `hassio_api` permet a l'add-on de publier un message de discovery aupres du
# Supervisor, pour que l'integration MaBarak se propose automatiquement.
hassio_api: true
# `homeassistant_api` permet a l'add-on de lire le Core (registres appareils et
# entites) pour lier une fiche a un robot, une PAC, etc. Acces local uniquement.
# Voir docs/adr/0006-liaison-aux-appareils-home-assistant.md.
homeassistant_api: true
discovery:
  - mabarak

# --- Options ----------------------------------------------------------------
options:
  log_level: info

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)

# Pas de `watchdog` : la sonde du Supervisor serait rejetee par le filtrage
# d'adresse IP de nginx, ce qui provoquerait une boucle de redemarrage.
#
# Pas de `map` : l'add-on n'a besoin d'aucun repertoire partage. Toutes ses
# donnees vivent dans /data, qui est fourni et sauvegarde automatiquement.
#
# `image` est volontairement absent : Home Assistant construit donc l'add-on
# localement a l'installation. A decommenter le jour ou la CI publie des images
# pre-construites, ce qui evitera aux utilisateurs un build de plusieurs minutes :
# image: ghcr.io/k69sknk/mabarak-{arch}
