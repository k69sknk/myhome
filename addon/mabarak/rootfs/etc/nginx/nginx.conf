# =============================================================================
# nginx — point d'entree de l'ingress Home Assistant
# =============================================================================
# Deux roles, et deux seulement :
#   1. filtrer les adresses IP pour n'accepter que le proxy Home Assistant ;
#   2. servir les assets statiques du frontend.
# Tout le reste est relaye au backend, qui injecte lui-meme le chemin d'ingress
# dans la coquille HTML (il a un acces propre a l'en-tete X-Ingress-Path).
# =============================================================================

daemon off;
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Les logs d'acces partiraient dans le journal de l'add-on a chaque requete,
    # ce qui noie les messages utiles sans rien apporter en local.
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Import de documents (factures scannees, notices PDF, photos).
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    upstream mabarak_api {
        server 127.0.0.1:8000;
        keepalive 8;
    }

    server {
        listen 8099 default_server;

        # ---------------------------------------------------------------------
        # Seul le proxy d'ingress Home Assistant doit pouvoir joindre l'add-on.
        # L'utilisateur est deja authentifie quand la requete arrive ici : ce
        # filtrage EST le mecanisme de securite de l'add-on. Ne pas l'elargir.
        # ---------------------------------------------------------------------
        allow 172.30.32.2;
        deny all;

        root /usr/share/mabarak/www;

        # Assets hashes par Vite : le nom change a chaque build, donc cache long.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /favicon.svg {
            expires 7d;
            try_files $uri =404;
        }

        # API et coquille SPA. Le backend lit X-Ingress-Path pour construire le
        # chemin de base de l'application (cf. docs/ARCHITECTURE.md section 4).
        location / {
            proxy_pass http://mabarak_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }
}
