---
# Images de base utilisees par le builder Home Assistant.
#
# Choix de Debian trixie plutot qu'Alpine : le backend cible Python 3.13, et
# Alpine 3.21/3.22 ne fournit que Python 3.12. Les images
# `home-assistant/*-base-python` s'arretent a 3.12-alpine3.18, donc trop
# anciennes. Debian trixie fournit Python 3.13.5 en paquet natif.
# Contrepartie assumee : une image plus volumineuse qu'avec Alpine.

build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:trixie
  amd64: ghcr.io/home-assistant/amd64-base-debian:trixie
  armv7: ghcr.io/home-assistant/armv7-base-debian:trixie

labels:
  org.opencontainers.image.title: HomeKeeper
  org.opencontainers.image.description: Gestion et entretien de la maison
  org.opencontainers.image.source: https://github.com/k69sknk/myhome
  org.opencontainers.image.licenses: MIT
