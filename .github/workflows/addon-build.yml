name: Build de l'add-on

on:
  # Les ancres YAML ne sont pas interpretees par GitHub Actions : la liste de
  # chemins est donc dupliquee volontairement.
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/stage-addon.sh"
      - ".github/workflows/addon-build.yml"
  pull_request:
    paths:
      - "addon/**"
      - "backend/**"
      - "frontend/**"
      - "scripts/stage-addon.sh"
      - ".github/workflows/addon-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le contexte de build est le repertoire de l'add-on : le backend et le
      # frontend doivent y etre stages au prealable
      # (voir addon/mabarak/Dockerfile).
      - name: Preparer les artefacts
        run: ./scripts/stage-addon.sh

      # Les architectures ARM sont construites en emulation sur des runners x86.
      - name: Configurer QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Le build n'est pas pousse : il ne sert qu'a verifier que l'image se
      # construit sur les architectures declarees dans config.yaml.
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: ./addon/mabarak
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}
