# Publication des images de l'add-on sur GHCR.
name: Publier l'add-on

# Sans image publiee, Home Assistant construit l'add-on sur la machine de
# l'utilisateur a l'installation : plusieurs minutes sur un x86, beaucoup plus
# sur un Raspberry Pi, ou chaque dependance Python est compilee. La CI construit
# deja les deux architectures a chaque commit (addon-build.yml) — elle jette
# simplement le resultat. Ce workflow le garde.
#
# Le declencheur est la publication d'une release, et non un push sur main :
# c'est le moment ou un numero de version est fige, et `config.yaml` designe
# l'image par ce numero. Publier a chaque commit produirait des images que rien
# n'installe jamais.

on:
  release:
    types: [published]
  # Pour republier une version dont la premiere tentative a echoue, sans avoir
  # a supprimer et recreer la release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier (par defaut, celle de config.yaml)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      # La version publiee vient de config.yaml et de nulle part ailleurs :
      # c'est elle que Home Assistant ira chercher, et ADR-0005 impose qu'elle
      # soit la meme partout. La lire ici evite qu'un tag mal forme publie une
      # image que l'add-on ne demandera jamais.
      - name: Lire la version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^version: "\(.*\)"$/\1/p' addon/mabarak/config.yaml)
          fi
          if [ -z "$version" ]; then
            echo "Aucune version trouvee dans addon/mabarak/config.yaml" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Version a publier : $version"

      - name: Verifier que les artefacts annoncent tous cette version
        run: python3 scripts/check-versions.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparer les artefacts
        run: ./scripts/stage-addon.sh

      - name: Configurer QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom suit la convention du builder Home Assistant : `image` dans
      # config.yaml porte `{arch}`, que le Supervisor remplace avant de tirer
      # l'image, et le tag est le numero de version de l'add-on.
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ./addon/mabarak
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:trixie
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mabarak-${{ matrix.arch }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/mabarak-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=addon-${{ matrix.arch }}

  # Une image publiee que personne ne peut tirer ne sert a rien, et le paquet
  # GHCR nait prive. Cette verification le dit tout de suite plutot que de
  # laisser un utilisateur decouvrir un « denied » a l'installation.
  verifier:
    name: Verifier que les images sont tirables
    runs-on: ubuntu-latest
    needs: publier
    steps:
      - uses: actions/checkout@v4
      - name: Lire la version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^version: "\(.*\)"$/\1/p' addon/mabarak/config.yaml)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Tirer les deux images sans authentification
        run: |
          set -euo pipefail
          proprietaire=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echec=0
          for arch in amd64 aarch64; do
            image="ghcr.io/$proprietaire/mabarak-$arch:${{ steps.version.outputs.value }}"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "OK   $image"
            else
              echo "ECHEC $image n'est pas tirable publiquement."
              echec=1
            fi
          done
          if [ "$echec" = 1 ]; then
            echo
            echo "Les paquets GHCR naissent prives. Rendez-les publics une fois :"
            echo "  https://github.com/${{ github.repository_owner }}?tab=packages"
            echo "  -> mabarak-amd64 / mabarak-aarch64 -> Package settings -> Change visibility"
            exit 1
          fi
