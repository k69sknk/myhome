[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mabarak-api"
version = "0.30.1"
description = "Backend de MaBarak — gestion et entretien de la maison, local-first"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "MaBarak" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "websockets>=14",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]

[project.scripts]
# Appele par le service s6 `init-mabarak` avant tout demarrage de l'API.
mabarak-migrate = "mabarak_api.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Les migrations vivent DANS le paquet et non a cote : elles doivent etre
# presentes dans le conteneur, ou seul le paquet installe existe. Sans elles,
# l'add-on ne pourrait pas mettre la base a niveau au demarrage.
mabarak_api = [
    "py.typed",
    "schema.sql",
    "alembic/*.py",
    "alembic/*.mako",
    "alembic/versions/*.py",
    "catalog/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # pathlib plutot que os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"src/mabarak_api/routers/*.py" = ["B008"]
"src/mabarak_api/models/__init__.py" = ["A003", "RUF012"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mabarak_api"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
