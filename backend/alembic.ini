# Configuration Alembic pour l'usage developpeur (`alembic` en ligne de commande
# depuis backend/).
#
# Dans le conteneur, cette configuration n'est PAS utilisee : la commande
# `mabarak-migrate` construit la sienne par le code, car seul le paquet
# installe existe. Voir src/mabarak_api/migrate.py.

[alembic]
script_location = src/mabarak_api/alembic
prepend_sys_path = src
path_separator = os

# Laisse vide : env.py retombe alors sur l'URL calculee par les reglages de
# l'application, ce qui evite de dupliquer le chemin de la base.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
